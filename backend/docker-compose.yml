# Local development database. Run from backend/:  docker compose up -d
# Host port is 5433 because 5432 is often taken by a system Postgres.
name: razorpay-learning   # own project name, so it never clashes with other 'backend' folders

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: razorpay
      POSTGRES_PASSWORD: razorpay_dev_password   # local dev only; use a secret store in production
      POSTGRES_DB: razorpay
    ports:
      - "127.0.0.1:5433:5432"   # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorpay -d razorpay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
